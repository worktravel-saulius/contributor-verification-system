name: GitHub to NotebookLM knowledge digest

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Build and upload redacted organization digests
    if: ${{ vars.NOTEBOOKLM_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Drive authentication dependency
        run: python -m pip install -r requirements.txt

      - name: Check required configuration
        shell: bash
        env:
          APP_ID: ${{ vars.GITHUB_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GITHUB_SYNC_APP_PRIVATE_KEY }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          DRIVE_FOLDER_LABS: ${{ vars.DRIVE_FOLDER_SAULIUS_SYSTEMS_LABS }}
          DRIVE_FOLDER_WORKTRAVEL: ${{ vars.DRIVE_FOLDER_WORKTRAVEL_SAULIUS }}
        run: |
          set -euo pipefail
          missing=()
          for name in APP_ID APP_PRIVATE_KEY WIF_PROVIDER WIF_SERVICE_ACCOUNT DRIVE_FOLDER_LABS DRIVE_FOLDER_WORKTRAVEL; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing required GitHub configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Mint read-only token for saulius-systems-labs
        id: labs-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v1.12.0
        with:
          app-id: ${{ vars.GITHUB_SYNC_APP_ID }}
          private-key: ${{ secrets.GITHUB_SYNC_APP_PRIVATE_KEY }}
          owner: saulius-systems-labs
          permission-contents: read
          permission-pull-requests: read

      - name: Sync saulius-systems-labs
        env:
          GITHUB_APP_TOKEN: ${{ steps.labs-token.outputs.token }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_SAULIUS_SYSTEMS_LABS }}
        run: python scripts/github_notebooklm_sync.py --organization saulius-systems-labs --drive-folder-id "$DRIVE_FOLDER_ID"

      - name: Mint read-only token for worktravel-saulius
        id: worktravel-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v1.12.0
        with:
          app-id: ${{ vars.GITHUB_SYNC_APP_ID }}
          private-key: ${{ secrets.GITHUB_SYNC_APP_PRIVATE_KEY }}
          owner: worktravel-saulius
          permission-contents: read
          permission-pull-requests: read

      - name: Sync worktravel-saulius
        env:
          GITHUB_APP_TOKEN: ${{ steps.worktravel-token.outputs.token }}
          DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_WORKTRAVEL_SAULIUS }}
        run: python scripts/github_notebooklm_sync.py --organization worktravel-saulius --drive-folder-id "$DRIVE_FOLDER_ID"
