name: NotebookLM companion safety checks

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-checks:
    name: Validate non-publishing companion artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest==9.1.1

      - name: Run companion safety tests
        run: python -m pytest tests/test_sync.py
